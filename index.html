<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RESCURO — AI Emergency Command Center</title>
    <meta name="description" content="Real-time AI voice triage, telemetry inspection, and emergency monitoring command center">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#EEF2FF',
                            100: '#E0E7FF',
                            500: '#6366F1',
                            600: '#4F46E5',
                            700: '#4338CA',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#F0F4F8] text-slate-800 antialiased min-h-screen selection:bg-indigo-100 selection:text-indigo-900 relative overflow-x-hidden">

    <!-- Dynamic Organic Gradient Mesh Orbs (Floating Lavender, Electric Cyan, Soft Rose) -->
    <div class="ambient-mesh-lavender"></div>
    <div class="ambient-mesh-cyan"></div>
    <div class="ambient-mesh-rose"></div>
    <div class="ambient-mesh-indigo"></div>

    <!-- Root Container for React App -->
    <div id="root" class="relative z-10"></div>

    <!-- Vite Application Entrypoint -->
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
